[package]
name = "email-sdk"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Rust email SDK with client, plugins, retries, fallbacks, SMTP, and all provider integrations."

[features]
default = ["native-tls"]
# SMTP over TLS with the platform's library (OpenSSL on Linux).
native-tls = ["dep:tokio-native-tls"]
# SMTP over TLS with rustls and the Mozilla root certificates; wins over
# `native-tls` when both are on.
rustls = ["dep:tokio-rustls", "dep:rustls", "dep:webpki-roots"]

[dependencies]
async-trait.workspace = true
base64.workspace = true
chrono.workspace = true
email-sdk-core = { version = "0.1.1", path = "../email-sdk-core" }
hmac.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
tokio-native-tls = { workspace = true, optional = true }
tokio-rustls = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
webpki-roots = { workspace = true, optional = true }
